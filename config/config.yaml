# Regular-season MLB; latest resolves to yesterday in the run manifest.
statcast_start_date: '2015-03-01'
statcast_end_date: latest
historical_build: true
statcast_game_dates_only: true
# All primary raw data and MLB supplemental telemetry are retained.
duckdb_memory_limit: 6GB
derived_pitch_chunk: season
# Follow-up beyond pitch sample is required to label late-sample appearances.
followup_days: 90
injury_link_lookback_days: 180
# An unresolved surgery onset cannot establish healthy negatives in this interval.
uncertain_onset_lookback_days: 180
baseline_appearances: 20
baseline_min_history: 5
velocity_segment_pitches: 20
high_velocity_mph: 95
fastball_types: [FF, SI, FC]
major_pitch_types: [FF, SI, FC, SL, ST, CU, KC, CH, FS, SV]
network_workers: 4
request_timeout_seconds: 90
request_retries: 3
refresh_metadata_hours: 24
database_path: database/mlb_ucl.duckdb
cache_path: data/cache
export_path: data/exports
report_path: reports
roegele_sheet_id: 1gQujXQQGOVNaiuwSN680Hq-FDVsCwvN-3AazykOBON0
include_internal_brace: true
include_mlb_pitch_tracking: true
